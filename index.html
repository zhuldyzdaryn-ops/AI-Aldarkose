<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор задач Алдаркөсе</title>
    <!-- Исправленная ссылка на шрифты (Устраняет ошибку 404) -->
    <link href="[https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap](https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap)" rel="stylesheet">
    <style>
        body { font-family: 'Roboto', sans-serif; background-color: #f9f5f0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1, h2 { color: #d35400; }
        input[type="text"] { padding: 8px; width: calc(100% - 20px); margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px; }
        button { background: #d35400; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #e67e22; }
        .task { background: #fff3e0; padding: 15px; margin-bottom: 15px; border-left: 5px solid #d35400; border-radius: 4px; }
        .blank-input { width: 60px !important; padding: 4px; margin: 0 5px; text-align: center; border: 2px solid #e67e22; background: #fff; }
        .solution-step { margin-top: 10px; font-family: monospace; font-size: 14px; background: #fdfbf7; padding: 10px; border-radius: 4px; border: 1px dashed #ccc; }
        #loading { color: #888; font-style: italic; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>Генератор задач от Алдаркөсе</h1>
    <input type="text" id="topicInput" placeholder="Введите тему (например: Теплоемкость)">
    <button onclick="generateSheet()">Создать рабочий лист</button>
    
    <p id="loading">Алдаркөсе думает над задачами... Пожалуйста, подождите.</p>
    <div id="output"></div>
</div>

<script>
    // ИСПРАВЛЕНИЕ ОШИБКИ 405: Вставьте сюда только чистый URL воркера. Никаких скобок!
    const API_URL = "https://ТВОЙ_ВОРКЕР_URL.workers.dev";

    async function generateSheet() {
        const topic = document.getElementById('topicInput').value;
        const output = document.getElementById('output');
        const loading = document.getElementById('loading');
        
        if (!topic) return alert("Введите тему!");

        loading.style.display = 'block';
        output.innerHTML = '';

        try {
            // Формируем чистый POST запрос к /api/generate
            const response = await fetch(`${API_URL}/api/generate`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ topic: topic })
            });

            if (!response.ok) {
                const errData = await response.json();
                throw new Error(errData.error || `Ошибка сервера: ${response.status}`);
            }

            const data = await response.json();
            renderSheet(data.sheet);
        } catch (error) {
            output.innerHTML = `<p style="color:red;"><b>Ошибка:</b> ${error.message}</p>`;
        } finally {
            loading.style.display = 'none';
        }
    }

    function renderSheet(sheet) {
        const output = document.getElementById('output');
        let html = `<h2>Тема: ${sheet.topic}</h2>`;
        html += `<p><i>💎 Ценность: ${sheet.adal_azamat_value}</i></p>`;

        sheet.tasks.forEach(task => {
            html += `<div class="task">`;
            html += `<b>Задача ${task.id} (Уровень ${task.level}, ${task.points} б.):</b> ${task.text}<br>`;
            
            if (task.dano) {
                html += `<div style="margin-top: 10px;"><b>Дано:</b> ${task.dano}</div>`;
            }

            if (task.type === 'multiple_choice') {
                task.options.forEach(opt => {
                    html += `<label style="display:block;"><input type="radio" name="task_${task.id}"> ${opt}</label>`;
                });
            } else if (task.type === 'short_answer') {
                html += `<input type="text" style="width: 100px;" placeholder="Ответ"> ${task.unit || ''}`;
            } else if (task.type === 'blanks' && task.solution_template) {
                // Превращаем разделитель '|' в перенос строки, а '[ПРОПУСК]' в поля ввода
                let solutionHTML = task.solution_template
                    .split('|').join('<br><br>') 
                    .split('[ПРОПУСК]').join(`<input type="text" class="blank-input" placeholder="?">`);
                
                html += `<div class="solution-step">${solutionHTML}</div>`;
            }
            html += `</div>`;
        });

        output.innerHTML = html;
    }
</script>

</body>
</html>
